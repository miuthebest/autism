<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emoji chemistry sandbox</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #fff6fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      color: #444;
    }

    .container {
      display: flex;
      margin-top: 40px;
      gap: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
      padding: 20px 25px;
    }

    .palette {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff0f6;
      border-radius: 15px;
      padding: 20px;
      min-width: 150px;
    }

    .palette h2 {
      color: #ff6ca5;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .atoms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .atom {
      font-size: 30px;
      cursor: grab;
      text-align: center;
      user-select: none;
    }

    .canvas {
      position: relative;
      background: #fffafb;
      border: 2px dashed #ffd5e3;
      width: 600px;
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
    }

    .node {
      position: absolute;
      font-size: 28px;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .node:active {
      transform: scale(1.2);
    }

    .toolbar {
      margin-top: 10px;
      display: flex;
      justify-content: space-around;
      width: 100%;
    }

    button {
      background: #ffeaf2;
      border: 1px solid #ffc9dc;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      color: #ff6ca5;
      transition: all 0.2s;
    }

    button:hover {
      background: #ffb6c1;
      color: white;
    }

    .title {
      text-align: center;
      font-weight: 600;
      color: #ff6ca5;
      margin-bottom: 10px;
    }

    /* dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #ddd;
      }
      .container {
        background: #2c2c2c;
        box-shadow: 0 4px 12px rgba(255, 140, 176, 0.2);
      }
      .canvas {
        background: #262626;
        border: 2px dashed #555;
      }
      .palette {
        background: #333;
      }
      button {
        background: #3a3a3a;
        border: 1px solid #555;
        color: #ff9fc7;
      }
      button:hover {
        background: #ff9fc7;
        color: #2b2b2b;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="palette">
      <h2>Atoms (emoji)</h2>
      <div class="atoms">
        <div class="atom" draggable="true" data-type="🟣">🟣</div>
        <div class="atom" draggable="true" data-type="🔴">🔴</div>
        <div class="atom" draggable="true" data-type="⚫">⚫</div>
        <div class="atom" draggable="true" data-type="🟡">🟡</div>
        <div class="atom" draggable="true" data-type="🟢">🟢</div>
        <div class="atom" draggable="true" data-type="🔵">🔵</div>
      </div>
      <div class="toolbar">
        <button id="reset">Reset</button>
      </div>
    </div>

    <div class="canvas" id="canvas">
      <p style="text-align:center; color:#aaa; margin-top:180px;">Drag atoms here 💫</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const resetBtn = document.getElementById('reset');
    let nodes = [];

    // allow drop
    canvas.addEventListener('dragover', (e)=> e.preventDefault());

    // drop atom onto canvas
    canvas.addEventListener('drop', (e)=>{
      e.preventDefault();
      const type = e.dataTransfer.getData('text/plain');
      if(!type) return;
      const x = e.offsetX;
      const y = e.offsetY;
      const node = document.createElement('div');
      node.classList.add('node');
      node.textContent = type;
      node.style.left = `${x - 15}px`;
      node.style.top = `${y - 15}px`;
      node.draggable = true;
      canvas.appendChild(node);
      nodes.push(node);
    });

    // move existing nodes
    canvas.addEventListener('dragstart', (e)=>{
      if(!e.target.classList.contains('node')) return;
      e.dataTransfer.setData('text/plain', JSON.stringify({
        move: true,
        id: nodes.indexOf(e.target)
      }));
    });

    canvas.addEventListener('drop', (e)=>{
      const data = e.dataTransfer.getData('text/plain');
      try {
        const parsed = JSON.parse(data);
        if(parsed.move){
          const node = nodes[parsed.id];
          node.style.left = `${e.offsetX - 15}px`;
          node.style.top = `${e.offsetY - 15}px`;
          return;
        }
      } catch {}
    });

    // reset button
    resetBtn.addEventListener('click', ()=>{
      canvas.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:180px;">Drag atoms here 💫</p>';
      nodes = [];
    });
  </script>
</body>
</html>
