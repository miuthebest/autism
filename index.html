<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autism corner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at 30% 20%, #2a1740 0%, #0a0313 80%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    margin: auto;
    background: transparent;
  }
  h1 {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    letter-spacing: 1px;
    font-weight: 700;
    z-index: 2;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100%{transform:translate(-50%,0);}
    50%{transform:translate(-50%,-5px);}
  }
  .hud {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .menu {
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:22px;
  }
  button {
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:12px;
    padding:10px 20px;
    margin:10px;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:transform 0.2s;
  }
  button:hover {transform:scale(1.05);}
</style>
</head>
<body>
  <h1>(╹ڡ╹ )</h1>
  <div class="hud">
    <div id="timer">Survived: 0.0s</div>
    <div id="speed">Speed: normal</div>
  </div>
  <div class="menu" id="menu">
    wanna read a story?<br>
    <button id="rocket">🚀</button>
    <button id="ufo">🛸</button>
  </div>
  <canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
canvas.width=800;
canvas.height=400;

let running=false,player,obstacles=[],lastSpawn=0,survived=0,speedMultiplier=1,char="🚀";

function resetGame(){
  player={x:80,y:200,vy:0,lane:2,vx:80};
  obstacles=[];
  lastSpawn=0;survived=0;speedMultiplier=1;
}

function spawnObstacle(){
  const emojis=["🥀","💩","🐿️","🦔","🔩","🪵","🪨"];
  const o={
    x:canvas.width+50,
    y:80+Math.floor(Math.random()*5)*60,
    emoji:emojis[Math.floor(Math.random()*emojis.length)],
    speed:(0.25+Math.random()*0.25)*speedMultiplier*1.15
  };
  obstacles.push(o);
}

function drawBackground(){
  ctx.fillStyle=ctx.createRadialGradient(300,150,100,400,200,600);
  ctx.fillStyle.addColorStop?.(0,"#1d0930");
  ctx.fillStyle.addColorStop?.(1,"#05000c");
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // sao
  for(let i=0;i<60;i++){
    ctx.fillStyle="rgba(255,255,255,0.15)";
    ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,1,1);
  }
}

function drawPlayer(){
  ctx.font="40px serif";
  ctx.fillText(char,player.x,player.y);
}

function drawObstacles(){
  ctx.font="32px serif";
  for(let o of obstacles) ctx.fillText(o.emoji,o.x,o.y);
}

function update(dt){
  player.x+=player.vx*dt*1.15*(1+survived/120);
  if(player.x>canvas.width*0.25) player.x=canvas.width*0.25;

  obstacles.forEach(o=>o.x-=o.speed*dt*300);
  obstacles=obstacles.filter(o=>o.x>-50);

  obstacles.forEach(o=>{
    if(Math.abs(o.x-player.x)<30 && Math.abs(o.y-player.y)<30){
      running=false;
      document.getElementById('menu').innerHTML=`💥 You survived ${survived.toFixed(1)}s<br><button onclick="startGame()">Try again?</button>`;
      document.getElementById('menu').style.display="block";
    }
  });
}

function loop(ts){
  if(!running)return;
  const dt=0.016;
  survived+=dt;
  if(survived>10)speedMultiplier=1.2;
  if(survived>20)speedMultiplier=1.4;
  if(survived>35)speedMultiplier=1.7;
  if(survived>60)speedMultiplier=2.2;
  if(ts-lastSpawn>900-(survived*5)){
    spawnObstacle();lastSpawn=ts;
  }
  drawBackground();
  drawPlayer();
  drawObstacles();
  update(dt);
  document.getElementById('timer').textContent=`Survived: ${survived.toFixed(1)}s`;
  let speedLabel="normal";
  if(speedMultiplier>1.5)speedLabel="fast";
  if(speedMultiplier>2)speedLabel="crazy";
  document.getElementById('speed').textContent=`Speed: ${speedLabel}`;
  requestAnimationFrame(loop);
}

function startGame(){
  resetGame();
  document.getElementById('menu').style.display="none";
  running=true;
  requestAnimationFrame(loop);
}

document.getElementById('rocket').onclick=()=>{char="🚀";startGame();}
document.getElementById('ufo').onclick=()=>{char="🛸";startGame();}

window.addEventListener('keydown',e=>{
  if(!running)return;
  if(e.key==="ArrowUp"&&player.lane>0)player.lane--;
  if(e.key==="ArrowDown"&&player.lane<4)player.lane++;
  player.y=80+player.lane*60;
});
</script>
</body>
</html>
